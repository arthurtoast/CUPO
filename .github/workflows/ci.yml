name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-y-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # T-13 · Pruebas contra Supabase levantado de verdad: pgTAP (186 pruebas de
  # esquema, RLS, Storage y funciones), la integración del flujo de reserva por
  # la API pública y la prueba de concurrencia de reservar_cita.
  base-de-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Solo los servicios que usan las pruebas: Postgres, Auth, REST, Storage.
      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Pruebas pgTAP
        run: npx supabase test db
      - name: Exportar URL y llave de Supabase
        run: npx supabase status -o env | grep -E '^[A-Z_]+=' | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"
      - name: Prueba de integración del flujo de reserva
        run: npm run test:integracion
      - name: Prueba de concurrencia
        run: npm run test:concurrencia
      # T-16 · Pruebas E2E: la app compilada contra este mismo Supabase.
      - name: Compilar la app para las pruebas E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E de los flujos críticos
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
      - name: Detener Supabase
        if: always()
        run: npx supabase stop --no-backup
