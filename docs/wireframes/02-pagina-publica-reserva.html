<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página pública de reserva</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#F4F3EF}
a{color:#2B5CE6}a:hover{color:#1E42A8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F3EF; color: #1A1A18; font-family: 'IBM Plex Sans', system-ui, sans-serif">

  <header style="flex-shrink: 0; box-sizing: border-box; padding: 26px 20px 18px; background: #FFFFFF; border-bottom: 1px solid #E2E0D8">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px">
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #E2E0D8; color: #47453E; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">EL</span>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">Estética Lupita</h1>
        <span style="font-size: 13px; color: #75736A">Corte y peinado · 45 min</span>
      </div>
    </div>
    <p style="margin: 0; font-size: 14px; color: #47453E">Elige el día y la hora que te acomode. No necesitas cuenta.</p>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

    <section>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px">
        <h2 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #5C5A52">Septiembre</h2>
        <button type="button" style="font: inherit; font-size: 13px; color: {{accent}}; background: none; border: none; padding: 4px; cursor: pointer">Ver mes completo</button>
      </div>
      <div style="display: flex; gap: 9px">
        <button type="button" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; padding: 11px 0; border: 1px solid #DCDAD1; border-radius: 12px; background: #FFFFFF; cursor: pointer"><span style="font-size: 11px; color: #75736A">mié</span><span style="font-size: 17px; font-weight: 600; color: #1A1A18">23</span></button>
        <button type="button" aria-pressed="true" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; padding: 11px 0; border: 1px solid {{accent}}; border-radius: 12px; background: {{accent}}; cursor: pointer"><span style="font-size: 11px; color: #FFFFFF">jue</span><span style="font-size: 17px; font-weight: 600; color: #FFFFFF">24</span></button>
        <button type="button" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; padding: 11px 0; border: 1px solid #DCDAD1; border-radius: 12px; background: #FFFFFF; cursor: pointer"><span style="font-size: 11px; color: #75736A">vie</span><span style="font-size: 17px; font-weight: 600; color: #1A1A18">25</span></button>
        <button type="button" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; padding: 11px 0; border: 1px solid #DCDAD1; border-radius: 12px; background: #FFFFFF; cursor: pointer"><span style="font-size: 11px; color: #75736A">sáb</span><span style="font-size: 17px; font-weight: 600; color: #1A1A18">26</span></button>
        <button type="button" disabled style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; padding: 11px 0; border: 1px solid #E8E6DE; border-radius: 12px; background: #F0EEE8; cursor: not-allowed"><span style="font-size: 11px; color: #A3A199">dom</span><span style="font-size: 17px; font-weight: 600; color: #A3A199">27</span></button>
      </div>
    </section>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
      <h2 style="margin: 0 0 11px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #5C5A52">Jueves 24 · 6 horarios libres</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px">
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">09:00</button>
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">09:45</button>
        <button type="button" aria-pressed="true" style="font: inherit; font-size: 15px; font-weight: 600; padding: 14px 0; border: 1px solid {{accent}}; border-radius: 11px; background: {{accent}}; color: #FFFFFF; cursor: pointer">10:30</button>
        <button type="button" disabled style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #E8E6DE; border-radius: 11px; background: #F0EEE8; color: #A3A199; text-decoration: line-through; cursor: not-allowed">11:15</button>
        <button type="button" disabled style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #E8E6DE; border-radius: 11px; background: #F0EEE8; color: #A3A199; text-decoration: line-through; cursor: not-allowed">12:00</button>
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">16:00</button>
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">16:45</button>
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">17:30</button>
        <button type="button" style="font: inherit; font-size: 15px; padding: 14px 0; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18; cursor: pointer">18:15</button>
      </div>
    </section>

    <section style="flex-shrink: 0">
      <h2 style="margin: 0 0 11px; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: #5C5A52">Tus datos</h2>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="display: flex; flex-direction: column; gap: 5px">
          <label for="nombre" style="font-size: 13px; color: #5C5A52">Nombre</label>
          <input id="nombre" type="text" placeholder="Como quieres que te llamemos" style="box-sizing: border-box; padding: 13px 13px; font: inherit; font-size: 15px; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18">
        </div>
        <div style="display: flex; gap: 9px">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <label for="correo" style="font-size: 13px; color: #5C5A52">Correo</label>
            <input id="correo" type="email" placeholder="para tu confirmación" style="box-sizing: border-box; width: 100%; padding: 13px 13px; font: inherit; font-size: 15px; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18">
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <label for="tel" style="font-size: 13px; color: #5C5A52">Teléfono</label>
            <input id="tel" type="tel" placeholder="10 dígitos" style="box-sizing: border-box; width: 100%; padding: 13px 13px; font: inherit; font-size: 15px; border: 1px solid #DCDAD1; border-radius: 11px; background: #FFFFFF; color: #1A1A18">
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer style="flex-shrink: 0; box-sizing: border-box; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E2E0D8; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 15px; font-weight: 600">jue 24 · 10:30</span>
      <span style="font-size: 12px; color: #75736A">45 min</span>
    </div>
    <button type="button" style="flex-grow: 1; font: inherit; font-size: 16px; font-weight: 600; padding: 16px 0; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; cursor: pointer">Confirmar cita</button>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B5CE6","options":["#2B5CE6","#1A1A18","#B4533A","#2F7A55"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2B5CE6' };
  }
}
</script>
</body>
</html>
